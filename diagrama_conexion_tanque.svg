<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 780" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1e5aa8"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#999" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1000" height="780" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#222">Conexión correcta del tanque – vista lateral (esquema)</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#555">Una sola entrada (por arriba, con flotador) · una salida independiente (por el fondo) · un rebose</text>

  <!-- ground -->
  <rect x="20" y="690" width="960" height="14" fill="url(#hatch)" stroke="#777"/>
  <line x1="20" y1="690" x2="980" y2="690" stroke="#444" stroke-width="2"/>

  <!-- pillar + slab -->
  <rect x="520" y="480" width="40" height="210" fill="#d9d9d9" stroke="#555"/>
  <rect x="860" y="480" width="40" height="210" fill="#d9d9d9" stroke="#555"/>
  <rect x="500" y="452" width="420" height="28" fill="#bdbdbd" stroke="#555"/>
  <text x="710" y="471" text-anchor="middle" font-size="11" fill="#333">losa de concreto</text>

  <!-- tank -->
  <rect x="540" y="90" width="340" height="362" rx="14" fill="#dcebfa" stroke="#1e5aa8" stroke-width="3"/>
  <rect x="543" y="180" width="334" height="269" fill="#8ec1f0"/>
  <line x1="543" y1="180" x2="877" y2="180" stroke="#1e5aa8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="700" y="330" text-anchor="middle" font-size="18" fill="#12457f" font-weight="bold">TANQUE</text>
  <text x="868" y="174" text-anchor="end" font-size="11" fill="#12457f">nivel de corte del flotador</text>

  <!-- float valve inside tank -->
  <rect x="544" y="104" width="48" height="12" fill="#8a8a8a" stroke="#333"/>
  <line x1="592" y1="110" x2="672" y2="172" stroke="#333" stroke-width="3"/>
  <circle cx="684" cy="180" r="15" fill="#555" stroke="#222" stroke-width="2"/>

  <!-- overflow -->
  <path d="M544,140 H470 V690" fill="none" stroke="#1e5aa8" stroke-width="14" stroke-linejoin="round"/>
  <path d="M544,140 H470 V690" fill="none" stroke="#bcd9f5" stroke-width="9" stroke-linejoin="round"/>
  <line x1="470" y1="640" x2="470" y2="680" stroke="#1e5aa8" stroke-width="2" marker-end="url(#arr)"/>
  <text x="458" y="250" text-anchor="end" font-size="12" fill="#12457f">REBOSE</text>
  <text x="458" y="266" text-anchor="end" font-size="12" fill="#12457f">Ø mayor que la entrada,</text>
  <text x="458" y="282" text-anchor="end" font-size="12" fill="#12457f">sale sobre el nivel de corte</text>
  <text x="482" y="672" font-size="12" fill="#12457f">a desagüe</text>

  <!-- supply line (riser): pipe outline then fill -->
  <path d="M60,690 V560 H300 V110 H544" fill="none" stroke="#333" stroke-width="14" stroke-linejoin="round"/>
  <path d="M60,690 V560 H300 V110 H544" fill="none" stroke="#f3ead0" stroke-width="9" stroke-linejoin="round"/>
  <!-- flow arrows on supply -->
  <line x1="60" y1="650" x2="60" y2="610" stroke="#b45309" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="120" y1="560" x2="150" y2="560" stroke="#b45309" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="300" y1="420" x2="300" y2="380" stroke="#b45309" stroke-width="2" marker-end="url(#arrR)"/>
  <line x1="380" y1="110" x2="420" y2="110" stroke="#b45309" stroke-width="2" marker-end="url(#arrR)"/>

  <!-- red ball valve -->
  <rect x="150" y="548" width="44" height="24" rx="4" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <circle cx="172" cy="560" r="9" fill="#d62828" stroke="#7a1010" stroke-width="2"/>
  <rect x="166" y="524" width="12" height="26" rx="3" fill="#d62828" stroke="#7a1010"/>
  <!-- union -->
  <rect x="214" y="550" width="14" height="20" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <!-- check valve -->
  <rect x="238" y="546" width="46" height="28" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <path d="M250,552 L270,560 L250,568 Z" fill="#2e7d32"/>
  <line x1="272" y1="552" x2="272" y2="568" stroke="#2e7d32" stroke-width="3"/>

  <!-- outlet -->
  <path d="M877,425 H950 V660" fill="none" stroke="#333" stroke-width="14" stroke-linejoin="round"/>
  <path d="M877,425 H950 V660" fill="none" stroke="#f3ead0" stroke-width="9" stroke-linejoin="round"/>
  <rect x="898" y="413" width="26" height="24" rx="4" fill="#c9a227" stroke="#6b5410" stroke-width="2"/>
  <line x1="950" y1="560" x2="950" y2="610" stroke="#b45309" stroke-width="2" marker-end="url(#arrR)"/>
  <text x="940" y="672" text-anchor="end" font-size="13" font-weight="bold" fill="#333">A DISTRIBUCIÓN</text>

  <!-- callouts -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="35" cy="620" r="12" fill="#222"/><text x="35" y="625">1</text>
    <circle cx="172" cy="506" r="12" fill="#222"/><text x="172" y="511">2</text>
    <circle cx="261" cy="598" r="12" fill="#222"/><text x="261" y="603">3</text>
    <circle cx="330" cy="300" r="12" fill="#222"/><text x="330" y="305">4</text>
    <circle cx="640" cy="82" r="12" fill="#222"/><text x="640" y="87">5</text>
    <circle cx="500" cy="190" r="12" fill="#222"/><text x="500" y="195">6</text>
    <circle cx="911" cy="392" r="12" fill="#222"/><text x="911" y="397">7</text>
  </g>

  <!-- legend -->
  <rect x="20" y="715" width="960" height="58" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="11.5" fill="#222">
    <text x="30" y="732"><tspan font-weight="bold">1</tspan> Suministro (desde tanque inferior/bomba)   <tspan font-weight="bold">2</tspan> VÁLVULA ROJA: única entrada de agua   <tspan font-weight="bold">3</tspan> Válvula cheque + unión universal</text>
    <text x="30" y="750"><tspan font-weight="bold">4</tspan> Tubo ascendente: entra al tanque por ARRIBA   <tspan font-weight="bold">5</tspan> Válvula de flotador: cierra el llenado   <tspan font-weight="bold">6</tspan> Rebose independiente a desagüe</text>
    <text x="30" y="767"><tspan font-weight="bold">7</tspan> Salida de fondo con llave de bronce → distribución. NO se une con la línea de llenado (1–4).   Flechas naranjas = sentido del agua.</text>
  </g>
</svg>
