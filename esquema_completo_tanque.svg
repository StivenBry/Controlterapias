<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1200" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b45309"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e5aa8"/></marker>
    <pattern id="h" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#999"/></pattern>
  </defs>
  <rect width="820" height="1200" fill="#fff"/>
  <text x="410" y="36" text-anchor="middle" font-size="23" font-weight="bold" fill="#222">Esquema completo con lo que ya tienes</text>
  <text x="410" y="58" text-anchor="middle" font-size="13" fill="#555">Dos líneas separadas: LLENADO (roja → arriba) y SALIDA (check → distribución)</text>

  <!-- ground -->
  <rect x="20" y="1000" width="780" height="14" fill="url(#h)" stroke="#777"/>
  <line x1="20" y1="1000" x2="800" y2="1000" stroke="#444" stroke-width="2"/>

  <!-- pillars + slab -->
  <rect x="400" y="505" width="40" height="495" fill="#d9d9d9" stroke="#555"/>
  <rect x="640" y="505" width="40" height="495" fill="#d9d9d9" stroke="#555"/>
  <rect x="340" y="472" width="380" height="33" fill="#bdbdbd" stroke="#555"/>
  <text x="530" y="494" text-anchor="middle" font-size="11" fill="#333">losa de concreto</text>

  <!-- tank -->
  <rect x="360" y="110" width="320" height="362" rx="14" fill="#dcebfa" stroke="#1e5aa8" stroke-width="3"/>
  <rect x="363" y="215" width="314" height="254" fill="#8ec1f0"/>
  <line x1="363" y1="215" x2="677" y2="215" stroke="#1e5aa8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="520" y="350" text-anchor="middle" font-size="20" font-weight="bold" fill="#12457f">TANQUE</text>
  <text x="670" y="208" text-anchor="end" font-size="11" fill="#12457f">nivel de corte</text>
  <!-- float -->
  <rect x="364" y="132" width="48" height="12" fill="#8a8a8a" stroke="#333"/>
  <line x1="412" y1="138" x2="490" y2="205" stroke="#333" stroke-width="3"/>
  <circle cx="502" cy="214" r="15" fill="#555" stroke="#222" stroke-width="2"/>

  <!-- overflow -->
  <path d="M364,172 H250 V1000" fill="none" stroke="#1e5aa8" stroke-width="14" stroke-linejoin="round"/>
  <path d="M364,172 H250 V1000" fill="none" stroke="#bcd9f5" stroke-width="9" stroke-linejoin="round"/>
  <line x1="250" y1="930" x2="250" y2="985" stroke="#1e5aa8" stroke-width="2" marker-end="url(#b)"/>
  <text x="262" y="960" font-size="12" fill="#12457f">a desagüe</text>
  <g font-size="12" fill="#12457f"><text x="262" y="250">REBOSE</text><text x="262" y="266">Ø mayor que</text><text x="262" y="282">la entrada</text></g>

  <!-- supply line: from ground up the left side to float -->
  <path d="M120,1000 V132 H364" fill="none" stroke="#333" stroke-width="14" stroke-linejoin="round"/>
  <path d="M120,1000 V132 H364" fill="none" stroke="#f3ead0" stroke-width="9" stroke-linejoin="round"/>
  <line x1="120" y1="960" x2="120" y2="900" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <line x1="120" y1="420" x2="120" y2="360" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <line x1="170" y1="132" x2="215" y2="132" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <!-- red valve on supply -->
  <rect x="104" y="640" width="32" height="48" rx="5" fill="#f4f4f4" stroke="#333" stroke-width="2"/>
  <circle cx="120" cy="664" r="10" fill="#d62828" stroke="#7a1010" stroke-width="2"/>
  <rect x="136" y="658" width="30" height="12" rx="3" fill="#d62828" stroke="#7a1010"/>

  <!-- outlet: check at bottom port -> own line -->
  <path d="M680,445 H760 V1000" fill="none" stroke="#333" stroke-width="14" stroke-linejoin="round"/>
  <path d="M680,445 H760 V1000" fill="none" stroke="#f3ead0" stroke-width="9" stroke-linejoin="round"/>
  <rect x="694" y="430" width="44" height="30" rx="7" fill="#e8c35a" stroke="#6b5410" stroke-width="2"/>
  <path d="M726,437 L726,453 L710,445 Z" fill="#6b5410" transform="rotate(180 718 445)"/>
  <line x1="760" y1="700" x2="760" y2="760" stroke="#b45309" stroke-width="2" marker-end="url(#o)"/>
  <text x="744" y="985" text-anchor="end" font-size="13" font-weight="bold" fill="#333">A DISTRIBUCIÓN</text>

  <!-- connection to remove -->
  <line x1="130" y1="830" x2="752" y2="830" stroke="#d62828" stroke-width="4" stroke-dasharray="12 8"/>
  <g stroke="#d62828" stroke-width="9" stroke-linecap="round"><line x1="568" y1="805" x2="598" y2="855"/><line x1="598" y1="805" x2="568" y2="855"/></g>
  <rect x="440" y="866" width="330" height="48" fill="#fdeaea" stroke="#d62828"/>
  <text x="450" y="886" font-size="13" font-weight="bold" fill="#a31515">QUITAR toda unión entre la línea de</text>
  <text x="450" y="904" font-size="13" font-weight="bold" fill="#a31515">llenado y la de salida (tees/codos de la base)</text>

  <!-- callouts -->
  <g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
    <circle cx="82" cy="950" r="12" fill="#222"/><text x="82" y="955">1</text>
    <circle cx="82" cy="664" r="12" fill="#222"/><text x="82" y="669">2</text>
    <circle cx="82" cy="400" r="12" fill="#222"/><text x="82" y="405">3</text>
    <circle cx="560" cy="150" r="12" fill="#222"/><text x="560" y="155">4</text>
    <circle cx="215" cy="215" r="12" fill="#222"/><text x="215" y="220">5</text>
    <circle cx="716" cy="402" r="12" fill="#222"/><text x="716" y="407">6</text>
    <circle cx="800" cy="600" r="12" fill="#222" transform="translate(-14 0)"/><text x="786" y="605">7</text>
  </g>

  <!-- legend -->
  <rect x="20" y="1030" width="780" height="160" fill="#f7f7f7" stroke="#ccc"/>
  <g font-size="13" fill="#222">
    <text x="32" y="1054"><tspan font-weight="bold">1</tspan> Suministro: tubo que llega desde abajo</text>
    <text x="32" y="1076"><tspan font-weight="bold">2</tspan> Válvula ROJA: única entrada de agua al tanque</text>
    <text x="32" y="1098"><tspan font-weight="bold">3</tspan> Tubo que sube: entra al tanque SOLO por arriba</text>
    <text x="32" y="1120"><tspan font-weight="bold">4</tspan> Flotador: corta el llenado en el nivel de corte</text>
    <text x="32" y="1142"><tspan font-weight="bold">5</tspan> Rebose independiente a desagüe</text>
    <text x="32" y="1164"><tspan font-weight="bold">6</tspan> Check de bronce (ya instalada): flecha SALE del tanque</text>
    <text x="32" y="1184"><tspan font-weight="bold">7</tspan> Salida con su propio tubo a distribución</text>
    <text x="520" y="1054" font-size="12" fill="#555">Flechas naranjas = sentido del agua</text>
  </g>
</svg>
