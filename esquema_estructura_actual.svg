<!-- labels -->
<text x="120" y="780" font-size="12" fill="#444">puente</text>
<text x="105" y="934" font-size="12" fill="#444" transform="rotate(0)"> </text>
<text x="340" y="940" font-size="12" fill="#444" text-anchor="start"></text>
<rect x="444" y="1070" width="150" height="36" fill="#fff"/><text x="450" y="1087" font-size="13" font-weight="bold" fill="#333">A DISTRIBUCIÓN</text>
<text x="450" y="1102" font-size="11" fill="#555">(baja por el pilar)</text>
<text x="300" y="1096" font-size="13" font-weight="bold" fill="#333" text-anchor="end">SUMINISTRO</text>
<text x="300" y="1109" font-size="11" fill="#555" text-anchor="end"></text>
<g font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">
<circle cx="218" cy="962" r="0"/>
<circle cx="150" cy="1002" r="12" fill="#222"/><text x="150" y="1007">1</text>
<circle cx="429" cy="418" r="0"/>
<circle cx="430" cy="500" r="12" fill="#c62828"/><text x="430" y="505">2</text>
<circle cx="600" cy="150" r="12" fill="#c62828"/><text x="600" y="155">3</text>
<circle cx="130" cy="300" r="12" fill="#222"/><text x="130" y="305">4</text>
<circle cx="258" cy="840" r="12" fill="#222"/><text x="258" y="845">5</text>
<circle cx="470" cy="190" r="12" fill="#222"/><text x="470" y="195">6</text>
<circle cx="290" cy="640" r="12" fill="#222"/><text x="290" y="645">7</text>
</g>
<text x="515" y="600" font-size="12" fill="#2e7d32" font-weight="bold">sin suministro: el tanque</text>
<text x="515" y="616" font-size="12" fill="#2e7d32" font-weight="bold">sale por la check</text>
<rect x="20" y="1140" width="780" height="205" fill="#f7f7f7" stroke="#ccc"/>
<g font-size="13" fill="#222">
<text x="32" y="1162"><tspan font-weight="bold">1</tspan> Válvula roja: el agua del suministro entra por aquí (se queda igual)</text>
<text x="32" y="1184" fill="#a31515" font-weight="bold">2 CORREGIR – Check de bronce en el fondo del tanque:</text>
<text x="52" y="1202">debe cerrar contra el suministro. Si el agua entra al tanque por aquí,</text>
<text x="52" y="1220">está sucia o dañada: ábrela (tapa lateral), límpiala o cámbiala.</text>
<text x="32" y="1244" fill="#a31515" font-weight="bold">3 CORREGIR – Válvula de flotador: si con el brazo levantado a mano</text>
<text x="52" y="1262">el agua sigue saliendo, cambia el empaque/asiento o la válvula.</text>
<text x="32" y="1286"><tspan font-weight="bold">4</tspan> Tubo que sube a la entrada de arriba   <tspan font-weight="bold">5</tspan> Tubo que baja a la unión inferior   <tspan font-weight="bold">6</tspan> Tapón del tee: sin goteo</text>
<text x="32" y="1308"><tspan font-weight="bold">7</tspan> Tubo vertical que sube a la check</text>
<text x="32" y="1332" font-size="12" fill="#555">Esquema de conexiones, no a escala. Naranja = agua del suministro. Verde = agua del tanque.</text>
</g>
</svg>